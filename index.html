Price batane ke liye "cost" use hota hai (past aur present same).

Sahi spelling: confess.

"All mankind should be happy" sahi hai; mankind ke saath "the" nahi lagta.`.split("\n");
const Q=D.split("\n").map((l,i)=>{const p=l.split("~");return{id:i+1,q:p[0],o:p.slice(1,5),a:+p[5]}});
const SEC=[["सब",1,135],["साहित्य",1,100],["Syn/Ant/Idiom",101,114],["Narration",115,118],["Concord",119,124],["Spelling",125,131],["Article/Order",132,135]];
const M=[["Poet → Poem",[["Walt Whitman","Song of Myself"],["D. H. Lawrence","Snake"],["Rupert Brooke","The Soldier"],["W. H. Auden","Now the leaves are falling fast"],["John Donne","Sweetest Love I Do Not Goe"]]],
["Writer → Work",[["Martin Luther King, Jr.","I Have a Dream"],["Bertrand Russell","Ideas That Have Helped Mankind"],["Shiga Naoya","The Artist"],["Germaine Greer","A Child Is Born"],["Dorothy L. Sayers","How Free Is The Press"]]]];
const L="ABCD",app=document.getElementById("app");
let st={tab:"study",sec:0,find:"",show:true,mode:"mcq",pr:true,star:new Set(),wrong:new Set()};
try{st.star=new Set(JSON.parse(localStorage.getItem("eb_star")||"[]"));st.wrong=new Set(JSON.parse(localStorage.getItem("eb_wrong")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("eb_star",JSON.stringify([...st.star]));localStorage.setItem("eb_wrong",JSON.stringify([...st.wrong]))}catch(e){}};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const TABS=[["study","📖 पढ़ाई"],["quiz","📝 Quiz"],["match","🔗 Matching"],["rev","⭐ दोहराना"]];
function nav(){document.getElementById("nav").innerHTML=TABS.map(t=>`<button class="${st.tab==t[0]?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("")+`<button data-fs="1">⛶ Full screen</button><button data-ft="1">Aa फ़ॉन्ट</button><button data-f="1">A+</button><button data-f="-1">A−</button>`}
document.getElementById("nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.t){st.tab=b.dataset.t;quiz=null;render()}if(b.dataset.fs){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(x){}}if(b.dataset.ft)document.body.classList.toggle("ch");if(b.dataset.f){const r=document.documentElement,c=parseInt(getComputedStyle(r).getPropertyValue("--fs"));r.style.setProperty("--fs",Math.min(30,Math.max(14,c+2*b.dataset.f))+"px")}};
function qHTML(q,reveal=true,pr=false){return `<div class="q ${reveal?"":"hid"}"><button class="st" data-s="${q.id}" title="Star">${st.star.has(q.id)?"★":"☆"}</button><p><span class="n">${q.id}.</span> ${esc(q.q)}</p>${pr?q.o.map((o,i)=>`<label class="o"><input type="checkbox" data-p="${q.id}:${i}"> (${L[i]}) ${esc(o)}</label>`).join(""):st.mode=="ans"?(reveal?`<span class="ans">✔ (${L[q.a]}) ${esc(q.o[q.a])}</span>`:""):q.o.map((o,i)=>`<span class="o ${reveal&&i==q.a?"ok":""}">(${L[i]}) ${esc(o)}</span>`).join("")}</div>`}
function study(){const [,a,b]=SEC[st.sec],f=st.find.toLowerCase();
const list=Q.filter(q=>q.id>=a&&q.id<=b&&(!f||(q.q+q.o.join(" ")).toLowerCase().includes(f)));
app.innerHTML=`<div class="bar"><select id="sec">${SEC.map((s,i)=>`<option value="${i}" ${i==st.sec?"selected":""}>${s[0]} (${s[1]}–${s[2]})</option>`).join("")}</select><input id="fd" placeholder="खोजें…" value="${esc(st.find)}"><button id="tg">${st.show?"उत्तर छुपाएँ":"उत्तर दिखाएँ"}</button><label style="white-space:nowrap"><input type="checkbox" id="prc" ${st.pr?"checked":""}> चेकबॉक्स से उत्तर चुनो</label><button id="md">${st.mode=="mcq"?"👁 सिर्फ उत्तर":"👁 पूरा MCQ"}</button></div><div class="stat"><span>${list.length} प्रश्न</span><span>★ ${st.star.size}</span></div><div id="ls">${list.map(q=>qHTML(q,st.show&&!st.pr,st.pr)).join("")||"कुछ नहीं मिला"}</div>`;
sec.onchange=e=>{st.sec=+e.target.value;study()};tg.onclick=()=>{st.show=!st.show;study()};prc.onchange=()=>{st.pr=prc.checked;study()};md.onclick=()=>{st.mode=st.mode=="mcq"?"ans":"mcq";study()};
fd.oninput=e=>{st.find=e.target.value;const p=e.target.selectionStart;study();fd.focus();fd.setSelectionRange(p,p)}}
app.addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(b){const[id,i]=b.dataset.p.split(":").map(Number),q=Q[id-1],box=b.closest(".q");if(box.dataset.done){e.preventDefault();return}box.dataset.done=1;const bs=box.querySelectorAll(".o");bs[q.a].classList.add("ok");bs[q.a].querySelector("input").checked=true;if(i!=q.a){bs[i].classList.add("no");st.wrong.add(id)}else st.wrong.delete(id);save();box.insertAdjacentHTML("beforeend",`<p>${i==q.a?"✔ सही!":"✘ गलत — सही: ("+L[q.a]+") "+esc(q.o[q.a])}</p><p class="ex">💡 ${E[id-1]}</p>`)}});
app.addEventListener("click",e=>{const s=e.target.closest("[data-s]");if(s){const id=+s.dataset.s;st.star.has(id)?st.star.delete(id):st.star.add(id);save();s.textContent=st.star.has(id)?"★":"☆"}});
function match(){app.innerHTML=M.map(([t,p])=>`<h3 style="color:var(--y)">${t}</h3><div class="pair">${p.map(x=>`<span>${x[0]}</span><span class="n">➜ ${x[1]}</span>`).join("")}</div>`).join("")}
let quiz=null,tm;
function setup(){app.innerHTML=`<div class="bar"><select id="qs">${SEC.slice(1).concat([["⭐ Star वाले"],["❌ गलत वाले"]]).map((s,i)=>`<option value="${i+1}">${s[0]}</option>`).join("")}<option value="0">सब 135</option></select><select id="qn"><option>10</option><option>20</option><option>50</option><option value="999">सारे</option></select><button id="go">शुरू करें</button></div><p class="hint">Star/गलत वाले सेट के लिए पहले प्रश्न star करें या quiz खेलें।</p>`;
go.onclick=()=>{const i=+qs.value;let pool;if(i==0)pool=Q;else if(i==7)pool=Q.filter(q=>st.star.has(q.id));else if(i==8)pool=Q.filter(q=>st.wrong.has(q.id));else{const[,a,b]=SEC[i];pool=Q.filter(q=>q.id>=a&&q.id<=b)}
if(!pool.length){alert("इस सेट में कोई प्रश्न नहीं है");return}
quiz={l:shuf(pool).slice(0,+qn.value),i:0,sc:0,t:0,w:[],done:false};clearInterval(tm);tm=setInterval(()=>{if(quiz&&!quiz.done){quiz.t++;const e=document.getElementById("tm");if(e)e.textContent=fmt(quiz.t)}},1000);ask()}}
const fmt=s=>String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function ask(){const q=quiz.l[quiz.i];quiz.ans=false;
app.innerHTML=`<div class="stat"><span>प्रश्न ${quiz.i+1}/${quiz.l.length}</span><span>✔ ${quiz.sc}</span><span id="tm">${fmt(quiz.t)}</span></div><div class="q"><p><span class="n">Q${q.id}.</span> ${esc(q.q)}</p>${q.o.map((o,i)=>`<button class="o" data-c="${i}">(${L[i]}) ${esc(o)}</button>`).join("")}</div><div id="fb"></div>`}
function pick(c){if(quiz.ans)return;quiz.ans=true;const q=quiz.l[quiz.i],bs=app.querySelectorAll(".o");
bs[q.a].classList.add("ok");if(c==q.a){quiz.sc++;st.wrong.delete(q.id)}else{bs[c].classList.add("no");quiz.w.push(q);st.wrong.add(q.id)}save();
fb.innerHTML=`<p>${c==q.a?"✔ सही!":"✘ सही उत्तर: ("+L[q.a]+") "+esc(q.o[q.a])}</p><p class="ex">💡 ${E[q.id-1]}</p><button id="nx">${quiz.i+1<quiz.l.length?"अगला":"नतीजा देखें"}</button>`;nx.focus();nx.onclick=next}
function next(){if(quiz.i+1<quiz.l.length){quiz.i++;ask()}else{quiz.done=true;const p=Math.round(quiz.sc*100/quiz.l.length);
app.innerHTML=`<div class="big">${quiz.sc} / ${quiz.l.length} (${p}%)</div><p style="text-align:center">समय: ${fmt(quiz.t)} — ${p>=80?"शानदार! 🎉":p>=50?"ठीक है, और दोहराएँ":"और अभ्यास करें"}</p>${quiz.w.length?`<h3 style="color:var(--r)">गलत प्रश्न</h3>${quiz.w.map(q=>qHTML(q)).join("")}`:""}<div class="bar" style="justify-content:center"><button id="ag">फिर खेलें</button></div>`;ag.onclick=()=>{quiz=null;setup()}}}
app.addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(b&&quiz)pick(+b.dataset.c)});
document.addEventListener("keydown",e=>{if(st.tab!="quiz"||!quiz||quiz.done||e.target.matches("input,select"))return;const k=e.key.toUpperCase();let c=L.indexOf(k);if(c<0&&"1234".includes(k))c=+k-1;if(c>=0&&!quiz.ans)pick(c);else if(e.key=="Enter"&&quiz.ans){const n=document.getElementById("nx");n&&n.click()}});
function rev(){const a=Q.filter(q=>st.star.has(q.id)),w=Q.filter(q=>st.wrong.has(q.id));
app.innerHTML=`<h3 style="color:var(--y)">⭐ Star वाले (${a.length})</h3>${a.map(q=>qHTML(q)).join("")||"<p class='hint'>कोई नहीं — पढ़ाई में ☆ दबाएँ</p>"}<h3 style="color:var(--r)">❌ Quiz में गलत (${w.length})</h3>${w.map(q=>qHTML(q)).join("")||"<p class='hint'>कोई नहीं</p>"}`}
function render(){nav();({study,quiz:()=>quiz&&!quiz.done?ask():quiz?next():setup(),match,rev})[st.tab]()}
up.onclick=()=>scrollTo({top:0,behavior:"smooth"});dn.onclick=()=>scrollTo({top:document.documentElement.scrollHeight,behavior:"smooth"});
render();
</script></body></html>
